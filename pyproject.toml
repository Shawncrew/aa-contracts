[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-contracts"
description = "Alliance Auth plugin: a dashboard of ships currently on alliance contracts, read from corptools' synced contract data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shawncrew" }]
requires-python = ">=3.10"
dependencies = [
    "allianceauth>=4.6.1,<6",
    "allianceauth-corptools",
    "django-eveuniverse",
]
keywords = ["allianceauth", "eveonline", "contracts", "corptools"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Shawncrew/aa-contracts"
Source = "https://github.com/Shawncrew/aa-contracts"

[tool.hatch.version]
path = "aacontracts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["aacontracts"]
